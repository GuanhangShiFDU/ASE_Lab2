components:
  securitySchemes:
    serviceAuth:
      type: http
      scheme: bearer
      description: 仅受信服务凭据；验证签发方、受众、到期、服务身份和 scope；不能接收普通用户 token。
  schemas:
    Id:
      $ref: ./openapi.yaml#/components/schemas/Id
    UtcTime:
      $ref: ./openapi.yaml#/components/schemas/UtcTime
    Version:
      $ref: ./openapi.yaml#/components/schemas/Version
    CityId:
      $ref: ./openapi.yaml#/components/schemas/CityId
    Point:
      $ref: ./openapi.yaml#/components/schemas/Point
    Error:
      $ref: ./openapi.yaml#/components/schemas/Error
    DriverServiceState:
      $ref: ./openapi.yaml#/components/schemas/DriverServiceState
    TripMeasurement:
      $ref: ./openapi.yaml#/components/schemas/TripMeasurement
    Cancellation:
      $ref: ./openapi.yaml#/components/schemas/Cancellation
    Quote:
      $ref: ./openapi.yaml#/components/schemas/Quote
    RideOrder:
      $ref: ./openapi.yaml#/components/schemas/RideOrder
    Invitation:
      $ref: ./openapi.yaml#/components/schemas/Invitation
    TripResult:
      $ref: ./openapi.yaml#/components/schemas/TripResult
    BillPaymentState:
      $ref: ./openapi.yaml#/components/schemas/BillPaymentState
    FareRuleSnapshot:
      type: object
      additionalProperties: false
      properties:
        fareRuleVersionId:
          $ref: '#/components/schemas/Id'
        baseMinor: &id004
          type: integer
          minimum: 0
          maximum: 9007199254740991
        ratePerMeterMinor:
          type: string
          pattern: ^[0-9]+(\.[0-9]+)?$
        ratePerSecondMinor:
          type: string
          pattern: ^[0-9]+(\.[0-9]+)?$
        minimumMinor: *id004
        roundingPolicy:
          type: string
          enum:
          - HALF_UP
      required:
      - fareRuleVersionId
      - baseMinor
      - ratePerMeterMinor
      - ratePerSecondMinor
      - minimumMinor
      - roundingPolicy
    QuoteSnapshot:
      type: object
      additionalProperties: false
      properties:
        quote:
          $ref: '#/components/schemas/Quote'
        passengerId:
          $ref: '#/components/schemas/Id'
        fareRuleSnapshot:
          $ref: '#/components/schemas/FareRuleSnapshot'
      required:
      - quote
      - passengerId
      - fareRuleSnapshot
    MatchingOrder:
      type: object
      additionalProperties: false
      properties:
        order:
          $ref: '#/components/schemas/RideOrder'
        pickup:
          $ref: '#/components/schemas/Point'
        destination:
          $ref: '#/components/schemas/Point'
        aggregateVersion:
          $ref: '#/components/schemas/Version'
        pendingInvitation:
          oneOf:
          - $ref: '#/components/schemas/Invitation'
          - type: 'null'
      required:
      - order
      - pickup
      - destination
      - aggregateVersion
      - pendingInvitation
    CandidateRequest:
      type: object
      additionalProperties: false
      properties:
        cityId:
          $ref: '#/components/schemas/CityId'
        pickup:
          $ref: '#/components/schemas/Point'
        radiusMeters:
          type: integer
          minimum: 1
          maximum: 50000
        limit:
          type: integer
          minimum: 1
          maximum: 100
      required:
      - cityId
      - pickup
      - radiusMeters
      - limit
    LocationProof:
      type: object
      additionalProperties: false
      properties:
        driverId:
          $ref: '#/components/schemas/Id'
        cityId:
          $ref: '#/components/schemas/CityId'
        point:
          $ref: '#/components/schemas/Point'
        locationVersion:
          $ref: '#/components/schemas/Version'
        lastValidReceivedAt:
          $ref: '#/components/schemas/UtcTime'
      required:
      - driverId
      - cityId
      - point
      - locationVersion
      - lastValidReceivedAt
    Candidates:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LocationProof'
          maxItems: 100
        serverTime:
          $ref: '#/components/schemas/UtcTime'
      required:
      - items
      - serverTime
    DriverIds:
      type: object
      additionalProperties: false
      properties:
        driverIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'
          maxItems: 100
          minItems: 1
          uniqueItems: true
      required:
      - driverIds
    DriverEligibility:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DriverServiceState'
