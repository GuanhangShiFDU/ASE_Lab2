openapi: 3.1.0
info:
  title: Lab2 service-to-service contracts
  version: 0.4.0-contract-review
  description: 设计用内部 HTTPS/JSON。默认拒绝公网；serviceAuth 与 scope/城市/可信委托同时核验。每个操作的 server 是独立服务的虚构域名。
security:
- serviceAuth: []
paths:
  /internal/v1/quotes/{quoteId}:
    get:
      operationId: getQuoteSnapshot
      tags:
      - pricing-service
      servers:
      - url: https://pricing-service.example.invalid
      summary: getQuoteSnapshot
      description: S-02 保存不可变报价与原规则快照。仅本人委托；S-02 在首次建单时以自己的裁决时间检查 expiresAt；本读取不消耗报价、不重算。
      x-owner: pricing-service
      x-callers:
      - ride-service
      x-required-scope: getQuoteSnapshot
      x-delegated-subject-required: true
      responses:
        '200':
          description: 已授权权威结果；恢复读不产生新业务。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteSnapshot'
              example:
                quote:
                  quoteId: quote-booking-01
                  cityId: shanghai
                  pickup:
                    latitude: 31.2304
                    longitude: 121.4737
                    coordinateSystem: WGS84
                  destination:
                    latitude: 31.219
                    longitude: 121.445
                    coordinateSystem: WGS84
                  estimatedAmountMinor: 2800
                  currency: CNY
                  estimatedDistanceMeters: 6200
                  estimatedDurationSeconds: 1100
                  fareRuleVersionId: fare-sh-20261027-v1
                  cancellationRule:
                    cancellationRuleVersionId: cancel-v1
                    graceSeconds: 120
                    feeMinor: 500
                    currency: CNY
                  createdAt: '2026-10-27T02:00:00Z'
                  expiresAt: '2026-10-27T02:02:00Z'
                passengerId: passenger-booking-01
                fareRuleSnapshot:
                  fareRuleVersionId: fare-sh-20261027-v1
                  baseMinor: 900
                  ratePerMeterMinor: '0.11'
                  ratePerSecondMinor: '1'
                  minimumMinor: 1000
                  roundingPolicy: HALF_UP
        '400':
          description: INVALID_REQUEST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                INVALID_REQUEST:
                  $ref: ./openapi.yaml#/components/examples/INVALID_REQUEST
        '401':
          description: UNAUTHENTICATED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                UNAUTHENTICATED:
                  $ref: ./openapi.yaml#/components/examples/UNAUTHENTICATED
        '403':
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                FORBIDDEN:
                  $ref: ./openapi.yaml#/components/examples/FORBIDDEN
        '404':
          description: NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NOT_FOUND:
                  $ref: ./openapi.yaml#/components/examples/NOT_FOUND
        '429':
          description: RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                RATE_LIMITED:
                  $ref: ./openapi.yaml#/components/examples/RATE_LIMITED
          headers:
            Retry-After:
              description: 建议等待秒数；暂不可用可以省略，限流必须提供。不能因此换幂等键。
              schema:
                type: integer
                minimum: 1
              example: 5
        '503':
          description: DEPENDENCY_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                DEPENDENCY_UNAVAILABLE:
                  $ref: ./openapi.yaml#/components/examples/DEPENDENCY_UNAVAILABLE
          headers:
            Retry-After:
              description: 建议等待秒数；暂不可用可以省略，限流必须提供。不能因此换幂等键。
              schema:
                type: integer
                minimum: 1
              example: 5
      x-error-codes:
      - INVALID_REQUEST
      - UNAUTHENTICATED
      - FORBIDDEN
      - NOT_FOUND
      - RATE_LIMITED
      - DEPENDENCY_UNAVAILABLE
      parameters:
      - name: Delegation-Token
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 4096
        description: 受信身份组件签发，绑定当前服务/受众/用户/权限/短有效期并验证；不得转信客户端自填 passengerId。凭据不写日志。
      - name: quoteId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
