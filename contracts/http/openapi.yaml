components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 由 S-01 身份能力验证，具体 token 格式未指定。各业务服务另校验角色/资源归属。
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/Id'
      description: 同一主体+operationId 方法名+此键唯一；本键也称 operationId。内容相同返回原结果，内容不同报冲突。
    MinStateVersion:
      name: minStateVersion
      in: query
      schema:
        $ref: '#/components/schemas/Version'
      description: 仅针对本 rideOrderId。低于已见版本必须回源或报不可用，不能返回较旧状态。
    RideOrderId:
      name: rideOrderId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    OperationId:
      name: operationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    OperationType:
      name: operationType
      in: query
      required: true
      schema:
        type: string
        enum:
          - createRideOrder
          - acceptInvitation
          - rejectInvitation
          - cancelRideOrder
          - reportArrival
          - confirmBoardingAndStartTrip
          - completeTrip
          - createPaymentAttempt
  responses:
    Error400:
      description: 请求未成功；不得伪造业务结果。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INVALID_REQUEST
            message: 输入不合法
            requestId: req-example-01
            outcome: REJECTED
            retryable: false
    Error401:
      description: 请求未成功；不得伪造业务结果。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: UNAUTHENTICATED
            message: 请重新登录
            requestId: req-example-01
            outcome: REJECTED
            retryable: false
    Error403:
      description: 请求未成功；不得伪造业务结果。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: FORBIDDEN
            message: 无权执行此操作
            requestId: req-example-01
            outcome: REJECTED
            retryable: false
    Error404:
      description: 请求未成功；不得伪造业务结果。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: NOT_FOUND
            message: 资源不存在或对当前主体不可见
            requestId: req-example-01
            outcome: REJECTED
            retryable: false
    Error409:
      description: 请求未成功；不得伪造业务结果。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: QUOTE_EXPIRED
            message: 报价已过期，请重新报价
            requestId: req-example-01
            outcome: REJECTED
            retryable: false
    Error429:
      description: 请求未成功；不得伪造业务结果。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: RATE_LIMITED
            message: 请求过于频繁
            requestId: req-example-01
            outcome: REJECTED
            retryable: true
      headers:
        Retry-After:
          description: 建议退避秒数；重试写操作必须沿用原键。
          schema:
            type: integer
            minimum: 1
    Error503:
      description: 业务错误；具体 code 见 booking.md / cancellation.md / trip-payment.md 及每个操作的 x-error-codes。写请求传输异常/提交未知不能推断未执行。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: OPERATION_PENDING
            message: 尚不能确认操作结果，请用原键查询或恢复
            requestId: req-example-01
            outcome: UNKNOWN
            retryable: true
      headers:
        Retry-After:
          description: 建议退避秒数；重试写操作必须沿用原键。
          schema:
            type: integer
            minimum: 1
  schemas:
