openapi: 3.1.0
info:
  title: ASE Lab 2 Ride-hailing API
  version: 0.3.0-trip-payment-draft
  description: '#71199991/94 的 12 个操作，加上 #71199995 的 8 个接驾、行程、费用和支付操作。仅设计契约；其余辅助接口及内部/渠道 HTTP 绑定由 #71199996 汇总。'
servers:
  - url: https://api.example.invalid
    description: 虚构地址，仅为设计示例
security:
  - bearerAuth: []
tags:
  - name: pricing-service
  - name: ride-service
  - name: location-service
  - name: payment-service
paths:
  /v1/quotes:
    post:
      operationId: createQuote
      tags:
        - pricing-service
      summary: 根据起终点生成限时报价
      description: 仅乘客本人。服务端核验起点所属支持城市、起终点同城和输入坐标，使用地图适配器预估。成功创建不可变报价（120 秒）；不是费用单。重新请求可生成新报价，无扣款或建单效果。
      responses:
        '201':
          description: 权威结果；详见操作语义。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
              example:
                quoteId: quote-booking-01
                cityId: shanghai
                pickup:
                  latitude: 31.2304
                  longitude: 121.4737
                  coordinateSystem: WGS84
                destination:
                  latitude: 31.219
                  longitude: 121.445
                  coordinateSystem: WGS84
                estimatedAmountMinor: 2800
                currency: CNY
                estimatedDistanceMeters: 6200
                estimatedDurationSeconds: 1100
                fareRuleVersionId: fare-sh-20261027-v1
                cancellationRule:
                  cancellationRuleVersionId: cancel-v1
                  graceSeconds: 120
                  feeMinor: 500
                  currency: CNY
                createdAt: '2026-10-27T02:00:00Z'
                expiresAt: '2026-10-27T02:02:00Z'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
            example:
              cityId: shanghai
              pickup:
                latitude: 31.2304
                longitude: 121.4737
                coordinateSystem: WGS84
              destination:
                latitude: 31.219
                longitude: 121.445
                coordinateSystem: WGS84
      x-error-codes:
        - UNSUPPORTED_CITY
        - CROSS_CITY_NOT_SUPPORTED
        - INVALID_COORDINATE
        - ROUTE_UNAVAILABLE
  /v1/ride-orders:
    post:
      operationId: createRideOrder
      tags:
        - ride-service
      summary: 确认报价并建立待匹配订单
      description: >-
        仅所属乘客。先恢复原幂等结果，再读 Quote；客户端不能改金额/起终点。首次决策 currentTime < expiresAt，独占 quoteId
        和全局乘客活动槽位。sourceOrderId 非空时须是本人 CANCELLED/MATCH_FAILED 旧单。MATCHING、OperationRecord、截止任务和
        Outbox 原子提交；201 只证明建单，不证明接单。原键重放仍返回首次 201 快照，随后 getRideOrder 读当前值。
      responses:
        '201':
          description: 权威结果；详见操作语义。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideOrder'
              example:
                rideOrderId: order-booking-01
                quoteId: quote-booking-01
                sourceOrderId: null
                cityId: shanghai
                state: MATCHING
                stateVersion: 1
                assignedDriverId: null
                createdAt: '2026-10-27T02:00:20Z'
                matchDeadline: '2026-10-27T02:01:20Z'
                acceptedAt: null
                serverTime: '2026-10-27T02:00:20Z'
                source: ride-service
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRideOrderRequest'
            example:
              quoteId: quote-booking-01
              sourceOrderId: null
      x-error-codes:
        - QUOTE_EXPIRED
        - QUOTE_ALREADY_USED
        - ACTIVE_RIDE_EXISTS
        - INVALID_SOURCE_ORDER
        - IDEMPOTENCY_CONFLICT
        - DEPENDENCY_UNAVAILABLE
        - OPERATION_PENDING
  /v1/ride-orders/{rideOrderId}:
    get:
      operationId: getRideOrder
      tags:
        - ride-service
      summary: 读取当前履约状态
      description: >-
        仅所属乘客或已分配司机；受邀未接单司机通过本人邀请读取最小必要信息。鉴权后返回 S-02 当前权威状态（缓存不可低于
        minStateVersion，恢复/刚操作后回源）。serverTime 表示本次读取时刻。
      responses:
        '200':
          description: 权威结果；详见操作语义。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideOrder'
              example:
                rideOrderId: order-booking-01
                quoteId: quote-booking-01
                sourceOrderId: null
                cityId: shanghai
                state: ASSIGNED
                stateVersion: 2
                assignedDriverId: driver-booking-01
                createdAt: '2026-10-27T02:00:20Z'
                matchDeadline: '2026-10-27T02:01:20Z'
                acceptedAt: '2026-10-27T02:00:28Z'
                serverTime: '2026-10-27T02:00:28Z'
                source: ride-service
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
        - $ref: '#/components/parameters/RideOrderId'
        - $ref: '#/components/parameters/MinStateVersion'
      x-error-codes:
        - NOT_FOUND
        - STATE_NOT_FRESH
        - DEPENDENCY_UNAVAILABLE
  /v1/me/active-ride:
    get:
      operationId: getMyActiveRide
      tags:
        - ride-service
      summary: 刷新后发现本人未结束订单
      description: >-
        乘客按 ActivePassengerRide，司机按 DriverServiceState.activeOrderId 回源。没有活动单返回
        rideOrder=null；不代表之前的未知叫车一定失败，仍需查询原 operationId。终态订单用已保存 orderId 查详情。
      responses:
        '200':
          description: 权威结果；详见操作语义。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveRide'
              example:
                rideOrder:
                  rideOrderId: order-booking-01
                  quoteId: quote-booking-01
                  sourceOrderId: null
                  cityId: shanghai
                  state: ASSIGNED
                  stateVersion: 2
                  assignedDriverId: driver-booking-01
                  createdAt: '2026-10-27T02:00:20Z'
                  matchDeadline: '2026-10-27T02:01:20Z'
                  acceptedAt: '2026-10-27T02:00:28Z'
                  serverTime: '2026-10-27T02:00:28Z'
                  source: ride-service
                serverTime: '2026-10-27T02:00:28Z'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      x-error-codes:
        - DEPENDENCY_UNAVAILABLE
  /v1/me/invitations:
    get:
      operationId: listDriverInvitations
      tags:
        - ride-service
      summary: 查询给本司机的当前有效邀请
      description: >-
        仅司机本人。返回当前未过期且订单仍 MATCHING 的 PENDING 邀请；可包含来自不同订单的邀请，按 expiresAt 排序，不能据列表判断最终可接单。约 5
        秒轮询加抖动，不延长期限。
      responses:
        '200':
          description: 权威结果；详见操作语义。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationList'
              example:
                items:
                  - invitationId: invite-booking-01
                    rideOrderId: order-booking-01
                    driverId: driver-booking-01
                    cityId: shanghai
                    state: PENDING
                    createdAt: '2026-10-27T02:00:22Z'
                    expiresAt: '2026-10-27T02:00:37Z'
                    matchDeadline: '2026-10-27T02:01:20Z'
                serverTime: '2026-10-27T02:00:24Z'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      x-error-codes:
        - DEPENDENCY_UNAVAILABLE
  /v1/invitations/{invitationId}/accept:
    post:
      operationId: acceptInvitation
      tags:
        - ride-service
      summary: 接受一个有效邀请
      description: >-
        仅受邀司机。先恢复原键，事务外读 S-05 位置证明，事务内重验其年龄（超过 15 秒不可用）、城市/在线/占用、MATCHING/PENDING、currentTime <
        expiresAt 和 matchDeadline。同事务写邀请 ACCEPTED、订单 ASSIGNED、司机占用、OperationRecord 及两类
        Outbox；提交后成功。重复原键返回原结果，不重验后来的过期时间；之后读当前订单。
      responses:
        '200':
          description: 权威结果；详见操作语义。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResult'
              example:
                operationId: op-accept-01
                invitation:
                  invitationId: invite-booking-01
                  rideOrderId: order-booking-01
                  driverId: driver-booking-01
                  cityId: shanghai
                  state: ACCEPTED
                  createdAt: '2026-10-27T02:00:22Z'
                  expiresAt: '2026-10-27T02:00:37Z'
                  matchDeadline: '2026-10-27T02:01:20Z'
                rideOrderId: order-booking-01
                stateVersion: 2
                decidedAt: '2026-10-27T02:00:28Z'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
        - $ref: '#/components/parameters/InvitationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      x-error-codes:
        - INVITATION_EXPIRED
        - ORDER_STATE_CONFLICT
        - DRIVER_UNAVAILABLE
        - LOCATION_STALE
        - IDEMPOTENCY_CONFLICT
        - DEPENDENCY_UNAVAILABLE
        - OPERATION_PENDING
  /v1/invitations/{invitationId}/reject:
    post:
      operationId: rejectInvitation
      tags:
        - ride-service
      summary: 拒绝邀请而不取消乘客订单
      description: >-
        仅受邀司机。原键恢复优先；首次必须仍 PENDING 且未到期限。邀请 REJECTED 与操作结果/Outbox 同事务提交，订单保持
        MATCHING。已被接受/撤销/过期返回冲突，不回滚已分配订单。
      responses:
        '200':
          description: 权威结果；详见操作语义。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResult'
              example:
                operationId: op-reject-01
                invitation:
                  invitationId: invite-booking-01
                  rideOrderId: order-booking-01
                  driverId: driver-booking-01
                  cityId: shanghai
                  state: REJECTED
                  createdAt: '2026-10-27T02:00:22Z'
                  expiresAt: '2026-10-27T02:00:37Z'
                  matchDeadline: '2026-10-27T02:01:20Z'
                rideOrderId: order-booking-01
                stateVersion: 1
                decidedAt: '2026-10-27T02:00:28Z'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
        - $ref: '#/components/parameters/InvitationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      x-error-codes:
        - INVITATION_EXPIRED
        - ORDER_STATE_CONFLICT
        - IDEMPOTENCY_CONFLICT
        - OPERATION_PENDING
  /v1/me/operations/{operationId}:
    get:
      operationId: getOperationResult
      tags:
        - ride-service
      summary: 恢复本人未知写请求的原结果
      description: 使用原 Idempotency-Key 及 operationType，按认证主体查询 OperationRecord。SUCCEEDED/REJECTED 是已存结果；PENDING 或 NOT_OBSERVED 都不能证明失败。原请求可能在途，继续查询或使用相同键和相同内容恢复，不能立刻换键建单。result
        是首次结果快照，读取当前状态应再调用 getRideOrder。 cancelRideOrder 的结果恢复同样适用；SUCCEEDED 的 result 为原 CancellationResult，确定拒绝重放原错误。 reportArrival/confirmBoardingAndStartTrip/completeTrip 路由 S-02；createPaymentAttempt 路由 S-06，必须按可信 operationType 选所有者。其 SUCCEEDED 只证明尝试建立，result 是原 202 PaymentAttemptResult；付款最终结果另查 getPaymentAttempt/getBillPaymentState。
      responses:
        '200':
          description: 权威结果；详见操作语义。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResult'
              example:
                operationId: op-order-01
                operationType: createRideOrder
                serverTime: '2026-10-27T02:00:25Z'
                status: SUCCEEDED
                result:
                  rideOrderId: order-booking-01
                  quoteId: quote-booking-01
                  sourceOrderId: null
                  cityId: shanghai
                  state: MATCHING
                  stateVersion: 1
                  assignedDriverId: null
                  createdAt: '2026-10-27T02:00:20Z'
                  matchDeadline: '2026-10-27T02:01:20Z'
                  acceptedAt: null
                  serverTime: '2026-10-27T02:00:20Z'
                  source: ride-service
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
        - $ref: '#/components/parameters/OperationId'
        - $ref: '#/components/parameters/OperationType'
      x-error-codes:
        - DEPENDENCY_UNAVAILABLE
  /v1/ride-orders/{rideOrderId}/location:
    get:
      operationId: getOrderLocation
      tags:
        - location-service
      summary: 读取本人当前订单关联司机的最新位置
      description: >-
        仅该订单乘客且仍 ASSIGNED/ARRIVED/IN_TRIP；S-05 向 S-02 验证关联（授权缓存最多 5 秒并按终态/分配变更失效，授权不明拒绝）。禁止接受任意
        driverId。超过 15 秒未有有效点返回 STALE 和旧点/时刻；没有有效点返回 UNAVAILABLE 和 null。位置依赖故障报 503，不修改履约状态。
      responses:
        '200':
          description: 权威结果；详见操作语义。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResult'
              example:
                rideOrderId: order-booking-01
                driverId: driver-booking-01
                locationVersion: 8
                point:
                  latitude: 31.2304
                  longitude: 121.4737
                  coordinateSystem: WGS84
                freshness: FRESH
                lastValidReceivedAt: '2026-10-27T02:00:27Z'
                serverTime: '2026-10-27T02:00:29Z'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
        - $ref: '#/components/parameters/RideOrderId'
      x-error-codes:
        - LOCATION_NOT_AUTHORIZED
        - DEPENDENCY_UNAVAILABLE
  /v1/ride-orders/{rideOrderId}/cancel:
    post:
      operationId: cancelRideOrder
      tags:
        - ride-service
      summary: 由乘客或已分配司机取消上车前的订单
      description: 仅所属乘客可 MATCHING/ASSIGNED/ARRIVED；已分配司机只可 ASSIGNED/ARRIVED。先恢复原键结果，新操作在 S-02 同一事务重验状态、expectedStateVersion
        和费用同意上限。裁决时间按原规则得出费用超过 maxAcceptedFeeMinor 时拒绝；恰好 120 秒收费。原子提交 Cancellation、终态、邀请/占用、操作记录与 Outbox 后返回 200，不等计费或通知。其他键已取消则
        ORDER_ALREADY_CANCELLED；未知结果保持原键。详见 cancellation.md。
      parameters:
        - $ref: '#/components/parameters/RideOrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 已提交的权威结果或明确的费用生成状态；不是支付确认。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancellationResult'
              example:
                operationId: op-cancel-01
                cancellation:
                  cancellationId: cancel-rebook-01
                  rideOrderId: order-rebook-old
                  state: CANCELLED
                  stateVersion: 3
                  previousState: ASSIGNED
                  actorRole: PASSENGER
                  reason: PLANS_CHANGED
                  driverId: driver-rebook-01
                  acceptedAt: '2026-10-27T02:00:10Z'
                  cancelledAt: '2026-10-27T02:02:10Z'
                  cancellationRule:
                    cancellationRuleVersionId: cancel-sh-01
                    graceSeconds: 120
                    feeMinor: 500
                    currency: CNY
                rideOrder:
                  rideOrderId: order-rebook-old
                  quoteId: quote-rebook-old
                  sourceOrderId: null
                  cityId: shanghai
                  state: CANCELLED
                  stateVersion: 3
                  assignedDriverId: driver-rebook-01
                  createdAt: '2026-10-27T02:00:05Z'
                  matchDeadline: '2026-10-27T02:01:05Z'
                  acceptedAt: '2026-10-27T02:00:10Z'
                  serverTime: '2026-10-27T02:02:10Z'
                  source: ride-service
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      x-error-codes:
        - FORBIDDEN
        - ORDER_VERSION_CONFLICT
        - ORDER_STATE_CONFLICT
        - ORDER_ALREADY_CANCELLED
        - CANCELLATION_FEE_CHANGED
        - IDEMPOTENCY_CONFLICT
        - OPERATION_PENDING
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRideOrderRequest'
            example:
              expectedStateVersion: 2
              maxAcceptedFeeMinor: 500
              reason: PLANS_CHANGED
  /v1/ride-orders/{rideOrderId}/cancellation:
    get:
      operationId: getCancellation
      tags:
        - ride-service
      summary: 读取本人参与订单的不可变取消事实
      description: 仅所属乘客或取消前已分配司机；不能从 ID 推断授权。没有取消事实返回 404，未知取消不能因此推断未执行。返回的事实不授予终态订单的实时位置权限。
      parameters:
        - $ref: '#/components/parameters/RideOrderId'
      responses:
        '200':
          description: 已提交的权威结果或明确的费用生成状态；不是支付确认。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cancellation'
              example:
                cancellationId: cancel-rebook-01
                rideOrderId: order-rebook-old
                state: CANCELLED
                stateVersion: 3
                previousState: ASSIGNED
