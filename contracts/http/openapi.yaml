  /v1/invitations/{invitationId}/accept:
    post:
      operationId: acceptInvitation
      tags:
      - ride-service
      summary: 接受一个有效邀请
      description: 仅受邀司机。先恢复原键，事务外读 S-05 位置证明，事务内重验其年龄（超过 15 秒不可用）、城市/在线/占用、MATCHING/PENDING、currentTime < expiresAt 和 matchDeadline。同事务写邀请
        ACCEPTED、订单 ASSIGNED、司机占用、OperationRecord 及两类 Outbox；提交后成功。重复原键返回原结果，不重验后来的过期时间；之后读当前订单。
      responses:
        '200':
          description: 权威结果；详见操作语义。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResult'
              example:
                operationId: op-accept-01
                invitation:
                  invitationId: invite-booking-01
                  rideOrderId: order-booking-01
                  driverId: driver-booking-01
                  cityId: shanghai
                  state: ACCEPTED
                  createdAt: '2026-10-27T02:00:22Z'
                  expiresAt: '2026-10-27T02:00:37Z'
                  matchDeadline: '2026-10-27T02:01:20Z'
                rideOrderId: order-booking-01
                stateVersion: 2
                decidedAt: '2026-10-27T02:00:28Z'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '400':
          description: INVALID_REQUEST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                INVALID_REQUEST:
                  $ref: '#/components/examples/INVALID_REQUEST'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '401':
          description: UNAUTHENTICATED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                UNAUTHENTICATED:
                  $ref: '#/components/examples/UNAUTHENTICATED'
          headers:
            Cache-Control:
