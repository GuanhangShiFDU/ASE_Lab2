            rideOrderId:
              $ref: '#/components/schemas/Id'
            status:
              const: BILL_READY
            bill:
              $ref: '#/components/schemas/TripBill'
            serverTime:
              $ref: '#/components/schemas/UtcTime'
            source:
              const: pricing-service
          required:
