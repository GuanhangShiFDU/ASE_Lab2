            cancellationId:
              $ref: '#/components/schemas/Id'
            serverTime:
              $ref: '#/components/schemas/UtcTime'
            source:
              type: string
              const: pricing-service
            status:
              type: string
              const: BILL_READY
            jobStatus:
              type: string
