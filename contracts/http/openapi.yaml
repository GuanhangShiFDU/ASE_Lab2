openapi: 3.1.0
info:
  title: ASE Lab 2 Ride-hailing API
  version: 0.4.0-contract-review
  description: '#71199996 汇总三条流程的 20 个核心操作和 8 个辅助操作。全部为设计契约，不存在可调用服务；错误响应含逐操作示例。内部服务绑定见 internal.yaml，适配器边界见 core-api.md。'
servers:
- url: https://api.example.invalid
  description: 虚构地址，仅为设计示例
security:
- bearerAuth: []
tags:
- name: participant-service
- name: ride-service
- name: pricing-service
- name: location-service
- name: payment-service
- name: notification-service
- name: operations-service
paths:
  /v1/quotes:
    post:
      operationId: createQuote
      tags:
      - pricing-service
      summary: 根据起终点生成限时报价
      description: 仅乘客本人。服务端核验起点所属支持城市、起终点同城和输入坐标，使用地图适配器预估。成功创建不可变报价（120 秒）；不是费用单。重新请求可生成新报价，无扣款或建单效果。
      responses:
        '201':
          description: 权威结果；详见操作语义。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
              example:
                quoteId: quote-booking-01
                cityId: shanghai
                pickup:
                  latitude: 31.2304
                  longitude: 121.4737
                  coordinateSystem: WGS84
                destination:
                  latitude: 31.219
                  longitude: 121.445
                  coordinateSystem: WGS84
                estimatedAmountMinor: 2800
                currency: CNY
                estimatedDistanceMeters: 6200
                estimatedDurationSeconds: 1100
                fareRuleVersionId: fare-sh-20261027-v1
                cancellationRule:
                  cancellationRuleVersionId: cancel-v1
                  graceSeconds: 120
                  feeMinor: 500
                  currency: CNY
                createdAt: '2026-10-27T02:00:00Z'
                expiresAt: '2026-10-27T02:02:00Z'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '400':
          description: INVALID_REQUEST; UNSUPPORTED_CITY; CROSS_CITY_NOT_SUPPORTED; INVALID_COORDINATE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                INVALID_REQUEST:
                  $ref: '#/components/examples/INVALID_REQUEST'
                UNSUPPORTED_CITY:
                  $ref: '#/components/examples/UNSUPPORTED_CITY'
                CROSS_CITY_NOT_SUPPORTED:
                  $ref: '#/components/examples/CROSS_CITY_NOT_SUPPORTED'
                INVALID_COORDINATE:
                  $ref: '#/components/examples/INVALID_COORDINATE'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '401':
          description: UNAUTHENTICATED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                UNAUTHENTICATED:
                  $ref: '#/components/examples/UNAUTHENTICATED'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '403':
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                FORBIDDEN:
                  $ref: '#/components/examples/FORBIDDEN'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '404':
          description: NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NOT_FOUND:
                  $ref: '#/components/examples/NOT_FOUND'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '429':
          description: RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                RATE_LIMITED:
                  $ref: '#/components/examples/RATE_LIMITED'
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '503':
          description: DEPENDENCY_UNAVAILABLE; ROUTE_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                DEPENDENCY_UNAVAILABLE:
                  $ref: '#/components/examples/DEPENDENCY_UNAVAILABLE'
                ROUTE_UNAVAILABLE:
                  $ref: '#/components/examples/ROUTE_UNAVAILABLE'
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
            example:
              cityId: shanghai
              pickup:
                latitude: 31.2304
                longitude: 121.4737
                coordinateSystem: WGS84
              destination:
                latitude: 31.219
                longitude: 121.445
                coordinateSystem: WGS84
      x-error-codes:
      - INVALID_REQUEST
      - UNAUTHENTICATED
      - FORBIDDEN
      - NOT_FOUND
      - RATE_LIMITED
      - DEPENDENCY_UNAVAILABLE
      - UNSUPPORTED_CITY
      - CROSS_CITY_NOT_SUPPORTED
      - INVALID_COORDINATE
      - ROUTE_UNAVAILABLE
      x-owner: pricing-service
      x-scope: core
      x-callers:
      - passenger
  /v1/ride-orders:
    post:
      operationId: createRideOrder
      tags:
      - ride-service
      summary: 确认报价并建立待匹配订单
      description: 仅所属乘客。先恢复原幂等结果，再读 Quote；客户端不能改金额/起终点。首次决策 currentTime < expiresAt，独占 quoteId 和全局乘客活动槽位。sourceOrderId 非空时须是本人
        CANCELLED/MATCH_FAILED 旧单。MATCHING、OperationRecord、截止任务和 Outbox 原子提交；201 只证明建单，不证明接单。原键重放仍返回首次 201 快照，随后 getRideOrder
        读当前值。
      responses:
        '201':
          description: 权威结果；详见操作语义。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideOrder'
              example:
                rideOrderId: order-booking-01
                quoteId: quote-booking-01
                sourceOrderId: null
                cityId: shanghai
                state: MATCHING
                stateVersion: 1
                assignedDriverId: null
                createdAt: '2026-10-27T02:00:20Z'
                matchDeadline: '2026-10-27T02:01:20Z'
                acceptedAt: null
                serverTime: '2026-10-27T02:00:20Z'
                source: ride-service
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '400':
          description: INVALID_REQUEST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                INVALID_REQUEST:
                  $ref: '#/components/examples/INVALID_REQUEST'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '401':
          description: UNAUTHENTICATED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                UNAUTHENTICATED:
                  $ref: '#/components/examples/UNAUTHENTICATED'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '403':
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                FORBIDDEN:
                  $ref: '#/components/examples/FORBIDDEN'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '404':
          description: NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NOT_FOUND:
                  $ref: '#/components/examples/NOT_FOUND'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '429':
          description: RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                RATE_LIMITED:
                  $ref: '#/components/examples/RATE_LIMITED'
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '503':
          description: DEPENDENCY_UNAVAILABLE; OPERATION_PENDING
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                DEPENDENCY_UNAVAILABLE:
                  $ref: '#/components/examples/DEPENDENCY_UNAVAILABLE'
                OPERATION_PENDING:
                  $ref: '#/components/examples/OPERATION_PENDING'
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '409':
          description: QUOTE_EXPIRED; QUOTE_ALREADY_USED; ACTIVE_RIDE_EXISTS; INVALID_SOURCE_ORDER; IDEMPOTENCY_CONFLICT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                QUOTE_EXPIRED:
                  $ref: '#/components/examples/QUOTE_EXPIRED'
                QUOTE_ALREADY_USED:
                  $ref: '#/components/examples/QUOTE_ALREADY_USED'
                ACTIVE_RIDE_EXISTS:
                  $ref: '#/components/examples/ACTIVE_RIDE_EXISTS'
                INVALID_SOURCE_ORDER:
                  $ref: '#/components/examples/INVALID_SOURCE_ORDER'
                IDEMPOTENCY_CONFLICT:
                  $ref: '#/components/examples/IDEMPOTENCY_CONFLICT'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRideOrderRequest'
            example:
              quoteId: quote-booking-01
              sourceOrderId: null
      x-error-codes:
      - INVALID_REQUEST
      - UNAUTHENTICATED
      - FORBIDDEN
      - NOT_FOUND
      - RATE_LIMITED
      - DEPENDENCY_UNAVAILABLE
      - QUOTE_EXPIRED
      - QUOTE_ALREADY_USED
      - ACTIVE_RIDE_EXISTS
      - INVALID_SOURCE_ORDER
      - IDEMPOTENCY_CONFLICT
      - OPERATION_PENDING
      x-owner: ride-service
      x-scope: core
      x-callers:
      - passenger
