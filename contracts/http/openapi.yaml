      summary: 为确定的费用单建立一次支付尝试
      description: 仅费用单所属乘客；确认 Bill 后提交其版本和本人支付方式引用，不接收客户端金额/身份。S-06 在事务外 getBillSnapshot 并核验不可变快照及支付方式归属；事务内检查 Receipt 和
        billId 唯一未决槽位，保存 CREATED、OperationRecord、持久发送任务、Outbox 后返回 202。worker 在事务外调用渠道。原键恢复原 202；异键未决返回 PAYMENT_IN_PROGRESS，已收款
