          required:
            - operationId
            - operationType
            - serverTime
            - status
            - error
        - type: object
          properties:
            operationId:
              $ref: '#/components/schemas/Id'
            operationType:
              type: string
              enum:
                - createRideOrder
                - acceptInvitation
