              examples:
                INVALID_REQUEST:
                  $ref: '#/components/examples/INVALID_REQUEST'
                INVALID_CURSOR:
                  $ref: '#/components/examples/INVALID_CURSOR'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '401':
          description: UNAUTHENTICATED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                UNAUTHENTICATED:
                  $ref: '#/components/examples/UNAUTHENTICATED'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '403':
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                FORBIDDEN:
                  $ref: '#/components/examples/FORBIDDEN'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '404':
          description: NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NOT_FOUND:
                  $ref: '#/components/examples/NOT_FOUND'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '429':
          description: RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                RATE_LIMITED:
                  $ref: '#/components/examples/RATE_LIMITED'
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '503':
          description: DEPENDENCY_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                DEPENDENCY_UNAVAILABLE:
                  $ref: '#/components/examples/DEPENDENCY_UNAVAILABLE'
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
      x-error-codes:
      - INVALID_REQUEST
      - UNAUTHENTICATED
      - FORBIDDEN
      - NOT_FOUND
      - RATE_LIMITED
      - DEPENDENCY_UNAVAILABLE
      - INVALID_CURSOR
      parameters:
      - name: cityId
        in: query
        required: true
        schema: &id005
          $ref: '#/components/schemas/CityId'
      - name: rideOrderId
        in: query
        required: false
        schema: &id003
          $ref: '#/components/schemas/Id'
      - *id001
      - *id002
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 由 S-01 身份能力验证，具体 token 格式未指定。各业务服务另校验角色/资源归属。
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/Id'
      description: 运行时操作键（也称 operationId），作用域为 (认证主体, operationType 方法名, 此键)。OpenAPI 的 operationId 则是固定方法名，两者不要混淆。同键同资源同内容恢复原结果；异内容冲突。
    MinStateVersion:
      name: minStateVersion
      in: query
      schema:
        $ref: '#/components/schemas/Version'
      description: 仅针对本 rideOrderId。低于已见版本必须回源或报不可用，不能返回较旧状态。
    RideOrderId:
      name: rideOrderId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    OperationId:
      name: operationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    OperationType:
      name: operationType
      in: query
      required: true
      schema:
        type: string
        enum:
        - createRideOrder
        - acceptInvitation
        - rejectInvitation
        - cancelRideOrder
        - reportArrival
        - confirmBoardingAndStartTrip
        - completeTrip
        - createPaymentAttempt
  schemas:
    Id:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$
    UtcTime:
      type: string
      format: date-time
      pattern: Z$
    Version:
      type: integer
      minimum: 1
      maximum: 9007199254740991
    CityId:
      type: string
      enum:
      - shanghai
      - hangzhou
      - nanjing
    Point:
      type: object
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        coordinateSystem:
          const: WGS84
          type: string
      required:
      - latitude
      - longitude
      - coordinateSystem
      additionalProperties: false
    QuoteRequest:
      type: object
      properties:
        cityId:
          $ref: '#/components/schemas/CityId'
        pickup:
          $ref: '#/components/schemas/Point'
        destination:
          $ref: '#/components/schemas/Point'
      required:
      - cityId
      - pickup
      - destination
      additionalProperties: false
    CancellationRule:
      type: object
      properties:
        cancellationRuleVersionId:
          $ref: '#/components/schemas/Id'
        graceSeconds:
          const: 120
          type: integer
        feeMinor:
          const: 500
          type: integer
        currency:
          const: CNY
          type: string
      required:
      - cancellationRuleVersionId
      - graceSeconds
      - feeMinor
      - currency
    Quote:
      type: object
      properties:
        quoteId:
          $ref: '#/components/schemas/Id'
        cityId:
          $ref: '#/components/schemas/CityId'
        pickup:
          $ref: '#/components/schemas/Point'
        destination:
          $ref: '#/components/schemas/Point'
        estimatedAmountMinor:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        currency:
          const: CNY
          type: string
        estimatedDistanceMeters:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        estimatedDurationSeconds:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        fareRuleVersionId:
          $ref: '#/components/schemas/Id'
        cancellationRule:
          $ref: '#/components/schemas/CancellationRule'
        createdAt:
          $ref: '#/components/schemas/UtcTime'
        expiresAt:
          $ref: '#/components/schemas/UtcTime'
      required:
      - quoteId
      - cityId
      - pickup
      - destination
      - estimatedAmountMinor
      - currency
      - estimatedDistanceMeters
      - estimatedDurationSeconds
      - fareRuleVersionId
      - cancellationRule
      - createdAt
      - expiresAt
    CreateRideOrderRequest:
      type: object
      properties:
        quoteId:
          $ref: '#/components/schemas/Id'
        sourceOrderId:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
      required:
      - quoteId
      - sourceOrderId
      additionalProperties: false
    RideOrder:
      type: object
      properties:
        rideOrderId:
          $ref: '#/components/schemas/Id'
        quoteId:
          $ref: '#/components/schemas/Id'
        sourceOrderId:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        cityId:
          $ref: '#/components/schemas/CityId'
        state:
          type: string
          enum:
          - MATCHING
          - ASSIGNED
          - ARRIVED
          - IN_TRIP
          - COMPLETED
          - CANCELLED
          - MATCH_FAILED
        stateVersion:
          $ref: '#/components/schemas/Version'
        assignedDriverId:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        createdAt:
          $ref: '#/components/schemas/UtcTime'
        matchDeadline:
          $ref: '#/components/schemas/UtcTime'
        acceptedAt:
          anyOf:
          - $ref: '#/components/schemas/UtcTime'
          - type: 'null'
        serverTime:
          $ref: '#/components/schemas/UtcTime'
        source:
          type: string
          const: ride-service
      required:
      - rideOrderId
      - quoteId
      - sourceOrderId
      - cityId
      - state
      - stateVersion
      - assignedDriverId
      - createdAt
      - matchDeadline
      - acceptedAt
      - serverTime
      - source
    Invitation:
      type: object
      properties:
        invitationId:
          $ref: '#/components/schemas/Id'
        rideOrderId:
          $ref: '#/components/schemas/Id'
        driverId:
          $ref: '#/components/schemas/Id'
        cityId:
          $ref: '#/components/schemas/CityId'
        state:
          type: string
          enum:
          - PENDING
          - ACCEPTED
          - REJECTED
          - EXPIRED
          - REVOKED
        createdAt:
          $ref: '#/components/schemas/UtcTime'
        expiresAt:
          $ref: '#/components/schemas/UtcTime'
        matchDeadline:
          $ref: '#/components/schemas/UtcTime'
      required:
      - invitationId
      - rideOrderId
      - driverId
      - cityId
      - state
      - createdAt
      - expiresAt
      - matchDeadline
    InvitationList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Invitation'
        serverTime:
          $ref: '#/components/schemas/UtcTime'
      required:
      - items
      - serverTime
    ActiveRide:
      type: object
      properties:
        rideOrder:
          anyOf:
          - $ref: '#/components/schemas/RideOrder'
          - type: 'null'
        serverTime:
          $ref: '#/components/schemas/UtcTime'
      required:
      - rideOrder
      - serverTime
    DecisionResult:
      type: object
      properties:
        operationId:
          $ref: '#/components/schemas/Id'
        invitation:
          $ref: '#/components/schemas/Invitation'
        rideOrderId:
          $ref: '#/components/schemas/Id'
        stateVersion:
          $ref: '#/components/schemas/Version'
        decidedAt:
          $ref: '#/components/schemas/UtcTime'
      required:
      - operationId
      - invitation
      - rideOrderId
      - stateVersion
      - decidedAt
    LocationResult:
      type: object
      properties:
        rideOrderId:
          $ref: '#/components/schemas/Id'
        driverId:
          $ref: '#/components/schemas/Id'
        locationVersion:
          anyOf:
          - $ref: '#/components/schemas/Version'
          - type: 'null'
        point:
          anyOf:
          - $ref: '#/components/schemas/Point'
          - type: 'null'
        freshness:
          type: string
          enum:
          - FRESH
          - STALE
          - UNAVAILABLE
        lastValidReceivedAt:
          anyOf:
          - $ref: '#/components/schemas/UtcTime'
          - type: 'null'
        serverTime:
          $ref: '#/components/schemas/UtcTime'
      required:
      - rideOrderId
      - driverId
      - locationVersion
      - point
      - freshness
      - lastValidReceivedAt
      - serverTime
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          $ref: '#/components/schemas/Id'
        outcome:
          type: string
          enum:
          - REJECTED
          - UNKNOWN
        retryable:
          type: boolean
        rideOrderId:
          $ref: '#/components/schemas/Id'
        stateVersion:
          $ref: '#/components/schemas/Version'
      required:
      - code
      - message
      - requestId
      - outcome
      - retryable
    OperationResult:
      oneOf:
      - type: object
        properties:
          operationId:
            $ref: '#/components/schemas/Id'
          operationType:
            type: string
            enum:
            - createRideOrder
            - acceptInvitation
            - rejectInvitation
            - cancelRideOrder
            - reportArrival
            - confirmBoardingAndStartTrip
            - completeTrip
            - createPaymentAttempt
            - updateMyProfile
            - setDriverAvailability
            - openLocationSession
          serverTime:
            $ref: '#/components/schemas/UtcTime'
          status:
            type: string
            enum:
            - SUCCEEDED
          result:
            oneOf:
            - $ref: '#/components/schemas/RideOrder'
            - $ref: '#/components/schemas/DecisionResult'
            - $ref: '#/components/schemas/CancellationResult'
            - $ref: '#/components/schemas/ArrivalResult'
            - $ref: '#/components/schemas/StartedTripResult'
            - $ref: '#/components/schemas/CompletedTripResult'
            - $ref: '#/components/schemas/PaymentAttemptResult'
            - $ref: '#/components/schemas/MyProfile'
            - $ref: '#/components/schemas/DriverServiceState'
            - $ref: '#/components/schemas/LocationSession'
        required:
        - operationId
        - operationType
        - serverTime
        - status
        - result
        allOf:
        - if:
            properties:
              operationType:
                const: createRideOrder
          then:
            properties:
              result:
                $ref: '#/components/schemas/RideOrder'
        - if:
            properties:
              operationType:
                const: acceptInvitation
          then:
            properties:
              result:
                $ref: '#/components/schemas/DecisionResult'
        - if:
            properties:
              operationType:
                const: rejectInvitation
          then:
            properties:
              result:
                $ref: '#/components/schemas/DecisionResult'
        - if:
            properties:
              operationType:
                const: cancelRideOrder
          then:
            properties:
              result:
                $ref: '#/components/schemas/CancellationResult'
        - if:
            properties:
              operationType:
                const: reportArrival
          then:
            properties:
              result:
                $ref: '#/components/schemas/ArrivalResult'
        - if:
            properties:
              operationType:
                const: confirmBoardingAndStartTrip
          then:
            properties:
              result:
                $ref: '#/components/schemas/StartedTripResult'
        - if:
            properties:
              operationType:
                const: completeTrip
          then:
            properties:
              result:
                $ref: '#/components/schemas/CompletedTripResult'
        - if:
            properties:
              operationType:
                const: createPaymentAttempt
          then:
            properties:
              result:
                $ref: '#/components/schemas/PaymentAttemptResult'
        - if:
            properties:
              operationType:
                const: updateMyProfile
          then:
            properties:
              result:
                $ref: '#/components/schemas/MyProfile'
        - if:
            properties:
              operationType:
                const: setDriverAvailability
          then:
            properties:
              result:
                $ref: '#/components/schemas/DriverServiceState'
        - if:
            properties:
              operationType:
                const: openLocationSession
          then:
            properties:
              result:
                $ref: '#/components/schemas/LocationSession'
      - type: object
        properties:
          operationId:
            $ref: '#/components/schemas/Id'
          operationType:
            type: string
            enum:
            - createRideOrder
            - acceptInvitation
            - rejectInvitation
            - cancelRideOrder
            - reportArrival
            - confirmBoardingAndStartTrip
            - completeTrip
            - createPaymentAttempt
            - updateMyProfile
            - setDriverAvailability
            - openLocationSession
          serverTime:
            $ref: '#/components/schemas/UtcTime'
          status:
            type: string
            enum:
            - REJECTED
          error:
            allOf:
            - $ref: '#/components/schemas/Error'
            - properties:
                outcome:
                  const: REJECTED
        required:
        - operationId
        - operationType
        - serverTime
        - status
        - error
      - type: object
        properties:
          operationId:
            $ref: '#/components/schemas/Id'
          operationType:
            type: string
            enum:
            - createRideOrder
            - acceptInvitation
            - rejectInvitation
            - cancelRideOrder
            - reportArrival
            - confirmBoardingAndStartTrip
            - completeTrip
            - createPaymentAttempt
            - updateMyProfile
            - setDriverAvailability
            - openLocationSession
          serverTime:
            $ref: '#/components/schemas/UtcTime'
          status:
            type: string
            enum:
            - PENDING
            - NOT_OBSERVED
        required:
        - operationId
        - operationType
        - serverTime
        - status
    CancelRideOrderRequest:
      type: object
      properties:
        expectedStateVersion:
          $ref: '#/components/schemas/Version'
        maxAcceptedFeeMinor:
          type: integer
          enum:
          - 0
          - 500
        reason:
          type: string
          enum:
          - PLANS_CHANGED
          - UNABLE_TO_PICK_UP
          - OTHER
      required:
      - expectedStateVersion
      - maxAcceptedFeeMinor
      - reason
      additionalProperties: false
    Cancellation:
      type: object
      properties:
        cancellationId:
          $ref: '#/components/schemas/Id'
        rideOrderId:
          $ref: '#/components/schemas/Id'
        state:
          type: string
          const: CANCELLED
        stateVersion:
          $ref: '#/components/schemas/Version'
        previousState:
          type: string
          enum:
          - MATCHING
          - ASSIGNED
          - ARRIVED
        actorRole:
          type: string
          enum:
          - PASSENGER
          - DRIVER
        reason:
          type: string
          enum:
          - PLANS_CHANGED
          - UNABLE_TO_PICK_UP
          - OTHER
        driverId:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        acceptedAt:
          anyOf:
          - $ref: '#/components/schemas/UtcTime'
          - type: 'null'
        cancelledAt:
          $ref: '#/components/schemas/UtcTime'
        cancellationRule:
          $ref: '#/components/schemas/CancellationRule'
      required:
      - cancellationId
      - rideOrderId
      - state
      - stateVersion
      - previousState
      - actorRole
      - reason
      - driverId
      - acceptedAt
      - cancelledAt
      - cancellationRule
      additionalProperties: false
    CancellationResult:
      type: object
      properties:
        operationId:
          $ref: '#/components/schemas/Id'
        cancellation:
          $ref: '#/components/schemas/Cancellation'
        rideOrder:
          $ref: '#/components/schemas/RideOrder'
      required:
      - operationId
      - cancellation
      - rideOrder
      additionalProperties: false
    CancellationBill:
      type: object
      properties:
        billId:
          $ref: '#/components/schemas/Id'
        billVersion:
          type: integer
          const: 1
        billingJobId:
          $ref: '#/components/schemas/Id'
        rideOrderId:
          $ref: '#/components/schemas/Id'
        kind:
          type: string
          const: CANCELLATION_FEE
        sourceId:
          $ref: '#/components/schemas/Id'
        amountMinor:
          type: integer
          enum:
          - 0
          - 500
        currency:
          type: string
          const: CNY
        ruleVersionId:
          $ref: '#/components/schemas/Id'
        createdAt:
          $ref: '#/components/schemas/UtcTime'
      required:
      - billId
      - billVersion
      - billingJobId
      - rideOrderId
      - kind
      - sourceId
      - amountMinor
      - currency
      - ruleVersionId
      - createdAt
      additionalProperties: false
    CancellationFeeResult:
      oneOf:
      - type: object
        properties:
          rideOrderId:
            $ref: '#/components/schemas/Id'
          cancellationId:
            $ref: '#/components/schemas/Id'
          serverTime:
            $ref: '#/components/schemas/UtcTime'
          source:
            type: string
            const: pricing-service
          status:
            type: string
            const: FEE_PENDING
          jobStatus:
            type: string
            enum:
            - NOT_OBSERVED
            - PENDING
            - RETRYING
            - REQUIRES_REVIEW
          bill:
            type: 'null'
        required:
        - rideOrderId
        - cancellationId
        - serverTime
        - source
        - status
        - jobStatus
        - bill
        additionalProperties: false
      - type: object
        properties:
          rideOrderId:
            $ref: '#/components/schemas/Id'
          cancellationId:
            $ref: '#/components/schemas/Id'
          serverTime:
            $ref: '#/components/schemas/UtcTime'
          source:
            type: string
            const: pricing-service
          status:
            type: string
            const: BILL_READY
          jobStatus:
            type: string
            const: READY
          bill:
            $ref: '#/components/schemas/CancellationBill'
        required:
        - rideOrderId
        - cancellationId
        - serverTime
        - source
        - status
        - jobStatus
        - bill
        additionalProperties: false
    TripVersionRequest:
      type: object
      additionalProperties: false
      properties:
        expectedStateVersion:
          $ref: '#/components/schemas/Version'
      required:
      - expectedStateVersion
    StartTripRequest:
      type: object
      additionalProperties: false
      properties:
        expectedStateVersion:
          $ref: '#/components/schemas/Version'
        boardingConfirmed:
          const: true
      required:
      - expectedStateVersion
      - boardingConfirmed
    TripMeasurement:
      type: object
      additionalProperties: false
      properties:
        actualDistanceMeters:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        durationSeconds:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        measurementVersion:
          $ref: '#/components/schemas/Version'
        meteringSource:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - actualDistanceMeters
      - durationSeconds
      - measurementVersion
      - meteringSource
    ArrivalResult:
      type: object
      additionalProperties: false
      properties:
        rideOrderId:
          $ref: '#/components/schemas/Id'
        driverId:
          $ref: '#/components/schemas/Id'
        state:
          const: ARRIVED
        stateVersion:
          $ref: '#/components/schemas/Version'
        arrivedAt:
          $ref: '#/components/schemas/UtcTime'
        serverTime:
          $ref: '#/components/schemas/UtcTime'
        source:
          const: ride-service
      required:
      - rideOrderId
      - driverId
      - state
      - stateVersion
      - arrivedAt
      - serverTime
      - source
    Trip:
      type: object
      additionalProperties: false
      properties:
        tripId:
          $ref: '#/components/schemas/Id'
        rideOrderId:
          $ref: '#/components/schemas/Id'
        passengerId:
          $ref: '#/components/schemas/Id'
        driverId:
          $ref: '#/components/schemas/Id'
        fareRuleVersionId:
          $ref: '#/components/schemas/Id'
        state:
          enum:
          - IN_PROGRESS
          - COMPLETED
        boardingConfirmedAt:
          $ref: '#/components/schemas/UtcTime'
        startedAt:
          $ref: '#/components/schemas/UtcTime'
        endedAt:
          oneOf:
          - $ref: '#/components/schemas/UtcTime'
          - type: 'null'
        measurement:
          oneOf:
          - $ref: '#/components/schemas/TripMeasurement'
          - type: 'null'
      required:
      - tripId
      - rideOrderId
      - passengerId
      - driverId
      - fareRuleVersionId
      - state
      - boardingConfirmedAt
      - startedAt
      - endedAt
      - measurement
      allOf:
      - if:
          properties:
            state:
              const: IN_PROGRESS
        then:
          properties:
            endedAt:
              type: 'null'
            measurement:
              type: 'null'
        else:
          properties:
            endedAt:
              $ref: '#/components/schemas/UtcTime'
    TripResult:
      type: object
      additionalProperties: false
      properties:
        trip:
          $ref: '#/components/schemas/Trip'
        rideOrderState:
          enum:
          - IN_TRIP
          - COMPLETED
        stateVersion:
          $ref: '#/components/schemas/Version'
        serverTime:
          $ref: '#/components/schemas/UtcTime'
        source:
          const: ride-service
      required:
      - trip
      - rideOrderState
      - stateVersion
      - serverTime
      - source
      allOf:
      - if:
          properties:
            rideOrderState:
              const: IN_TRIP
        then:
          properties:
            trip:
              properties:
                state:
                  const: IN_PROGRESS
        else:
          properties:
            trip:
              properties:
                state:
                  const: COMPLETED
    StartedTripResult:
      allOf:
      - $ref: '#/components/schemas/TripResult'
      - properties:
          rideOrderState:
            const: IN_TRIP
    CompletedTripResult:
